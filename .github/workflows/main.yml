name: Ping Streamlit App

on:
  workflow_dispatch:   # allows manual runs
  schedule:
    - cron: '0 0 * * *'   # Midnight UTC
    - cron: '0 8 * * *'   # 8 AM UTC
    - cron: '0 16 * * *'  # 4 PM UTC

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Streamlit app URL
        run: curl -Is https://positionn.streamlit.app | head -n 1
